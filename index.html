<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infinite Loop Background</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

.scenery-loop { 
  position: relative;
  width: 100vw;
  height: 100vh;
  background-image: url('bg.jpg');
  background-repeat: repeat-x;
  background-size: auto 100%;
  animation: moveBackground 15s linear infinite;
}

/* Carro posicionado mais para baixo */
.car {
  position: absolute;
  bottom: -50px; /* Reduzido para descer o carro */
  left: 15%;
  width: 220px;
  height: auto;
  z-index: 10;
}

/* Moto mantida na faixa de cima */
.motorbike {
  position: absolute;
  bottom: 60px;
  left: 45%;
  width: 160px;
  height: auto;
  z-index: 5;
}

@keyframes moveBackground {
  from {
    background-position: 0 0;
  }
  to {
    background-position: -2000px 0;
  }
}
</style>
</head>
<body>

<div class="scenery-loop">
  <img src="car.png" class="car" alt="Featured Car">
  <img src="motobike.png" class="motorbike" alt="Featured Motorbike">
</div>

</body>
</html>
